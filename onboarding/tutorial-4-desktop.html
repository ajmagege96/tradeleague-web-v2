<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1.0" />
    <title>TradeLeague — Tutorial 4 of 5</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        /* Brand */
        --brand-primary:        #27BC81;
        --brand-primary-hover:  #37CD9B;
        --brand-primary-muted:  rgba(39, 188, 129, 0.15);
        --brand-fade:           #EF4444;
        --brand-fade-muted:     rgba(239, 68, 68, 0.15);
        --brand-accent:         #6E42CF;
        --brand-accent-muted:   rgba(110, 66, 207, 0.15);

        /* Surfaces */
        --bg-page:              #07081a;
        --bg-base:              #0E0F26;
        --bg-surface:           #151E32;
        --bg-surface-elevated:  #1C2642;
        --bg-surface-hover:     #232E4A;

        /* Text */
        --text-primary:         #FFFFFF;
        --text-secondary:       #A0AEC0;
        --text-tertiary:        #646473;

        /* Borders */
        --border-default:       #2D3748;
        --border-subtle:        #1E2433;

        /* Typography */
        --font-sans:            'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

        /* Radii */
        --radius-sm:            6px;
        --radius-md:            12px;
        --radius-lg:            16px;
        --radius-full:          9999px;

        /* Motion */
        --ease-out:             cubic-bezier(0.4, 0, 0.2, 1);

        /* Layout */
        --screen-width:         390px;
      }

      * { box-sizing: border-box; }

      html {
        margin: 0; padding: 0; height: 100%;
        overflow: hidden; overscroll-behavior: none;
        background: var(--bg-page);
        color: var(--text-primary);
        font-family: var(--font-sans);
      }

      body {
        display: flex;
        justify-content: center;
        margin: 0;
        padding: 18px 14px 32px;
        height: 100vh; height: 100dvh;
        overflow: hidden; overscroll-behavior: none;
        background: var(--bg-page);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .phone {
        width: 100%;
        max-width: var(--screen-width);
        height: 100%;
        border-radius: 32px;
        overflow: hidden;
        border: 1px solid var(--border-default);
        background: var(--bg-base);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        position: relative;
      }

      @media (max-width: 480px) {
        body { padding: 0; }
        .phone { border-radius: 0; border: none; box-shadow: none; }
      }

      @media (min-width: 481px) {
        body { padding: 24px 16px 40px; }
      }

      .screen {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: var(--bg-base);
      }

            /* Faded trophy background — same cover-crop treatment as login1's
         hero: object-fit cover pinned toward the trophy (right side of
         the source image), oversized 105% so the trophy lands ~40% of
         screen height at any viewport. Kept faint so the panel reads. */
      img.tut-bg {
        position: absolute;
        left: 0;
        top: 9.5%;
        width: 100%;
        height: 105%;
        object-fit: cover;
        object-position: 97% 50%;
        opacity: 0.26;
        pointer-events: none;
        z-index: 0;
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 7%, rgba(0,0,0,1) 62%, rgba(0,0,0,0) 96%);
                mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 7%, rgba(0,0,0,1) 62%, rgba(0,0,0,0) 96%);
      }

      /* ─── Tutorial panel — login1-style layout ────────────────────
         Brand (wordmark + Built on Solana) at top, graphic floating
         in the leftover middle space, then dots → title → body →
         CTA → link anchored at the bottom. */
      .tut {
        position: relative;
        z-index: 1;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
        text-align: center;
      }

      /* Corner nav — back (left) + close X (right), floating over the
         screen. Back arrow is the canonical prediction-detail SVG; the
         X twists on hover. */
      .tut-nav-btn {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        z-index: 3;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        border-radius: var(--radius-full);
        color: var(--text-primary);
        cursor: pointer;
        transition: background-color 150ms ease, transform 150ms ease;
      }
      .tut-nav-btn:hover  { background: var(--bg-surface-hover); }
      .tut-nav-btn:active { transform: scale(0.96); }
      .tut-nav-btn.back  { left: 10px; }
      .tut-nav-btn.close { right: 10px; }
      .tut-nav-btn.close svg { transition: transform 300ms var(--ease-out); }
      .tut-nav-btn.close:hover svg { transform: rotate(90deg); }

      /* Brand block at top — mirrors login1's onboard-brand */
      .tut-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 12%;
        flex-shrink: 0;
      }
      img.wordmark { display: block; width: 260px; height: auto; }
      picture.built-on { display: inline-block; line-height: 0; }
      picture.built-on img { display: block; width: 130px; height: auto; opacity: 0.85; }

      /* Middle flexes — the graphic floats in the leftover space */
      .tut-mid {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Page dots — active page is an elongated green pill */
      .tut-dots {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 18px;
      }
      .tut-dot {
        width: 6px;
        height: 6px;
        border-radius: var(--radius-full);
        background: var(--text-tertiary);
        opacity: 0.55;
        transition: width 250ms var(--ease-out), background-color 250ms ease, opacity 250ms ease;
      }
      .tut-dot.active {
        width: 22px;
        background: var(--brand-primary);
        opacity: 1;
      }

      /* Graphic slot — FIXED height (tallest graphic = 94px) so dots,
         title, and body sit at identical positions on every page.
         Content is CENTERED: leftover slot air splits evenly above and
         below, keeping dots→graphic equal to graphic→title (both 18px
         + half the air) on every page. */
      .tut-art {
        height: 94px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }

      /* Page 4 art: podium — 1st place green, 2nd/3rd navy. Green is
         the deeper brand ramp (#27BC81 → #19AD6A), not the bright
         hover tint. */
      .tut-podium {
        display: flex;
        align-items: flex-end;
        gap: 6px;
      }
      .tp-col {
        width: 48px;
        border-radius: 8px 8px 3px 3px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10px;
        font-size: 15px;
        font-weight: 800;
        color: #fff;
      }
      .tp-col.first {
        height: 92px;
        background: linear-gradient(180deg, #27BC81 0%, #19AD6A 100%);
        box-shadow: 0 0 22px rgba(39, 188, 129, 0.25);
      }
      .tp-col.second,
      .tp-col.third {
        background: linear-gradient(180deg, #232E4A 0%, #1C2642 100%);
        border: 1px solid var(--border-default);
        color: var(--text-secondary);
      }
      .tp-col.second { height: 66px; }
      .tp-col.third  { height: 52px; }

      /* All titles are single-line — no reserved height needed. */
      .tut-title {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1.22;
        color: var(--text-primary);
        max-width: 300px;
        margin-bottom: 12px;
      }

      .tut-body {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.55;
        color: var(--text-secondary);
        max-width: 350px;
        margin-bottom: 32px;
        min-height: 44px;   /* two lines reserved — keeps CTA anchored */
      }

      /* CTA — canonical 48px green */
      .tut-cta {
        width: 100%;
        max-width: 320px;
        height: 48px;
        border: none;
        border-radius: var(--radius-md);
        background: var(--brand-primary);
        color: #fff;
        font-family: inherit;
        font-size: 14.5px;
        font-weight: 800;
        letter-spacing: -0.2px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(39, 188, 129, 0.32);
        transition: filter 150ms ease, transform 150ms ease;
      }
      .tut-cta:hover  { filter: brightness(1.06); }
      .tut-cta:active { transform: scale(0.98); }

      .tut-skip {
        margin-top: 16px;
        border: none;
        background: none;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.1px;
        cursor: pointer;
        padding: 4px 8px;
        transition: color 150ms ease;
      }
      .tut-skip:hover { color: var(--text-primary); }
    
/* ── Desktop fit (web v2, r2) — landing-page placement: brand and
   bottom cluster pulled together, centered vertically, column on the
   LEFT like tradeleague.com; trophy rides the right. Same screens. ── */
a.cta, a.tut-cta { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
a.tut-skip { display: block; text-align: center; text-decoration: none; }
@media (min-width: 900px) {
  body { padding: 0; }
  .phone { max-width: none; border-radius: 0; border: none; box-shadow: none; }
  img.hero-bg, img.tut-bg { top: 0; height: 100%; object-position: 84% 50%; }
  .onboard, .tut {
    width: 100%; max-width: 480px;
    margin: 0 0 0 clamp(48px, 9vw, 150px);
    /* brand pinned at one fixed height on every onboarding page
       (tutorial 2-5 placement) — content flows beneath it, so pages
       with less content no longer drift the logo */
    justify-content: flex-start;
    padding-top: 22vh;
  }
  .onboard-brand, .tut-brand { margin-top: 0; }
  .onboard-bottom { margin-top: 44px; padding-top: 0; }
  .tut-mid { flex: 0 0 auto; margin: 40px 0 28px; }
}
</style>
